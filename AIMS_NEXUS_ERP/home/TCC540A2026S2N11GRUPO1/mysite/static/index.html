<!-- Componentes Flutuantes, Modal de Login e Overlay de Iframe -->

  <!-- Grupo de Botões Flutuantes (Bolhas) -->
  <div class="fixed bottom-6 right-6 z-50 flex flex-col gap-3 items-end">

        <img src="https://tcc540a2026s2n11grupo1.pythonanywhere.com/static/icons/AIMS-AUDIT.png" alt="AIMS Logs Logo" class="w-full h-full object-contain">
      </div>
      <span class="text-xs tracking-wide">AIMS Logs</span>
    </button>

    <!-- Botão Bolha AIMS Finance -->
    <button onclick="openAimsAuth('finance')" class="flex items-center gap-3 bg-brand-700 hover:bg-brand-800 text-white font-semibold py-3 px-5 rounded-full shadow-2xl transition-all duration-300 transform hover:scale-105 border-2 border-brand-500/30">
      <div class="w-8 h-8 rounded-full bg-white flex items-center justify-center overflow-hidden p-1 shadow-inner">
        <img src="https://tcc540a2026s2n11grupo1.pythonanywhere.com/static/icons/AIMS-AUDIT.png" alt="AIMS Logo" class="w-full h-full object-contain">
      </div>
      <span class="text-sm tracking-wide">AIMS Finance</span>
    </button>
  </div>

  <!-- Modal de Login (Janela 50% de largura) -->
  <div id="aims-login-modal" class="fixed inset-0 z-[90] hidden bg-black/60 backdrop-blur-sm flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl shadow-2xl border border-brand-500/20 w-full sm:w-3/4 md:w-1/2 max-w-2xl overflow-hidden transform transition-all">
      <!-- Cabeçalho do Login -->
      <div class="bg-ink-900 text-white p-6 flex items-center justify-between border-b border-brand-800/40">
        <div class="flex items-center gap-3">
          <img src="https://tcc540a2026s2n11grupo1.pythonanywhere.com/static/icons/AIMS-AUDIT.png" alt="AIMS Logo" class="w-7 h-7 object-contain">
          <h3 id="login-modal-title" class="font-bold text-lg text-brand-100">Autenticação AIMS</h3>
        </div>
        <button onclick="toggleLoginModal(false)" class="text-ink-500 hover:text-white transition-colors">✕</button>
      </div>

      <!-- Formulário de Login -->
      <form onsubmit="handleAimsLogin(event)" class="p-8 flex flex-col gap-5">
        <p class="text-ink-700 text-sm">Insira suas credenciais de auditor para liberar o acesso ao ambiente restrito.</p>

        <div>
          <label class="block text-xs font-semibold text-ink-700 uppercase tracking-wider mb-2">Usuário</label>
          <input type="text" id="aims-user" required placeholder="Digite seu usuário" class="w-full px-4 py-2.5 rounded-lg border border-ink-300 focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-transparent text-sm">
        </div>

        <div>
          <label class="block text-xs font-semibold text-ink-700 uppercase tracking-wider mb-2">Senha</label>
          <input type="password" id="aims-pass" required placeholder="Digite sua senha" class="w-full px-4 py-2.5 rounded-lg border border-ink-300 focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-transparent text-sm">
        </div>

        <div id="login-error" class="hidden text-red-600 text-xs font-medium bg-red-50 p-3 rounded-lg border border-red-200">
          Usuário ou senha incorretos. Tente novamente.
        </div>

        <div class="flex items-center justify-end gap-3 mt-2">
          <button type="button" onclick="toggleLoginModal(false)" class="px-5 py-2.5 rounded-lg text-sm font-medium text-ink-700 hover:bg-ink-100 transition-colors">
            Cancelar
          </button>
          <button type="submit" class="bg-brand-600 hover:bg-brand-700 text-white px-6 py-2.5 rounded-lg text-sm font-semibold transition-all shadow-md hover:shadow-lg">
            Acessar Sistema
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- Container Iframe Fullscreen (Overlay Modal) -->
  <div id="aims-modal" class="fixed inset-0 z-[100] hidden bg-black/70 backdrop-blur-md flex flex-col transition-opacity duration-300">
    <!-- Barra Superior de Controle do Modal -->
    <div class="bg-ink-900 border-b border-brand-800/40 text-white px-6 py-3 flex items-center justify-between shadow-lg">
      <div class="flex items-center gap-3">
        <img src="https://tcc540a2026s2n11grupo1.pythonanywhere.com/static/icons/AIMS-AUDIT.png" alt="AIMS Logo" class="w-7 h-7 object-contain">
        <span id="iframe-modal-title" class="font-bold text-lg text-brand-100">AIMS System</span>
      </div>
      <button onclick="toggleAimsModal(false)" class="bg-red-500/20 hover:bg-red-600 text-red-300 hover:text-white px-4 py-1.5 rounded-full text-sm font-medium transition-colors duration-200 border border-red-500/30">
        ✕ Fechar
      </button>
    </div>

    <!-- Iframe Dinâmico -->
    <iframe id="aims-iframe" src="" class="w-full h-full border-none" title="AIMS System"></iframe>
  </div>
</div>

<script>
  let isAuthenticated = false;
  let targetSystem = 'finance';

  const ENDPOINTS = {
    finance: {
      title: 'AIMS Finance — Sistema de Auditoria Financeira',
      url: 'https://tcc540a2026s2n11grupo1.pythonanywhere.com/static/finance/index.html'
    },
     aimsnexuserp: {
      title: 'AIMS Finance — Sistema de Auditoria Financeira',
      url: 'https://tcc540a2026s2n11grupo1.pythonanywhere.com/static/erp/index.html'
    },
    logs: {
      title: 'AIMS Logs — Registros e Logs do Sistema',
      url: 'https://tcc540a2026s2n11grupo1.pythonanywhere.com/static/log/index.html'
    }
  };

  function openAimsAuth(system) {
    targetSystem = system;
    if (isAuthenticated) {
      toggleAimsModal(true);
    } else {
      const titleEl = document.getElementById('login-modal-title');
      if (titleEl) {
        titleEl.textContent = system === 'finance' ? 'Autenticação AIMS Finance' : 'Autenticação AIMS Logs';
      }
      toggleLoginModal(true);
    }
  }

  function toggleLoginModal(show) {
    const modal = document.getElementById('aims-login-modal');
    const errorDiv = document.getElementById('login-error');
    if (show) {
      modal.classList.remove('hidden');
      if (errorDiv) errorDiv.classList.add('hidden');
    } else {
      modal.classList.add('hidden');
    }
  }

  function handleAimsLogin(event) {
    event.preventDefault();
    const user = document.getElementById('aims-user').value;
    const pass = document.getElementById('aims-pass').value;
    const errorDiv = document.getElementById('login-error');

    // Usuário: admin / Senha: aims2026
    if (user === 'admin' && pass === 'aims2026') {
      isAuthenticated = true;
      toggleLoginModal(false);
      toggleAimsModal(true);
    } else {
      errorDiv.classList.remove('hidden');
    }
  }

  function toggleAimsModal(show) {
    const modal = document.getElementById('aims-modal');
    const iframe = document.getElementById('aims-iframe');
    const titleEl = document.getElementById('iframe-modal-title');

    if (show) {
      const config = ENDPOINTS[targetSystem];
      iframe.src = config.url;
      if (titleEl) titleEl.textContent = config.title;
      modal.classList.remove('hidden');
    } else {
      modal.classList.add('hidden');
      iframe.src = 'about:blank';
    }
  }
</script>
