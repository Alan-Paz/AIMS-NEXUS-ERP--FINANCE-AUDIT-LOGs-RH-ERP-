<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Organograma Tesouro</title>
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * {
            -webkit-box-sizing: border-box;
            -moz-box-sizing: border-box;
            box-sizing: border-box;
            position: relative;
            font-family: 'Lato', sans-serif;
        }

        .cf:before,
        .cf:after {
            content: " "; /* 1 */
            display: table; /* 2 */
        }

        .cf:after {
            clear: both;
        }

        /**
         * For IE 6/7 only
         * Include this rule to trigger hasLayout and contain floats.
         */
        .cf {
            *zoom: 1;
        }

        /* Generic styling */

        body {
            background: #dedede;
            margin: 0;
            padding: 20px 0;
        }

        .content {
            width: 100%;
            max-width: 1142px;
            margin: 0 auto;
            padding: 0 20px;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
        }

        a:focus {
            outline: 2px dashed #f7f7f7;
        }

        @media all and (max-width: 767px) {
            .content {
                padding: 0 20px;
            }
        }

        .administration ul, .administration {
            padding: 0;
            margin: 0;
            list-style: none;
        }

        ul.administration a {
            display: block;
            background: #c4dcc3;
            border: 4px solid #fff;
            text-align: center;
            overflow: hidden;
            font-size: .7em;
            text-decoration: none;
            font-weight: bold;
            color: #333;
            height: 70px;
            margin-bottom: -26px;
            box-shadow: 4px 4px 9px -4px rgba(0,0,0,0.4);
            -webkit-transition: all linear .1s;
            -moz-transition: all linear .1s;
            transition: all linear .1s;
        }

        ul.administration a:hover {
            cursor: zoom-in;
        }

        @media all and (max-width: 767px) {
            ul a {
                font-size: 1em;
            }
        }

        ul a span {
            margin-top: 8px;
            display: block;
        }

        .administration > li > a {
            margin-bottom: 25px;
        }

        .director > li > a {
            width: 51%;
            margin: 0 auto 0px auto;
        }

        .subdirector:after {
            content: "";
            display: block;
            width: 0;
            height: 130px;
            background: red;
            border-left: 4px solid #fff;
            left: 45.45%;
            position: relative;
        }

        .subdirector,
        .departments {
            position: absolute;
            width: 100%;
        }

        .subdirector > li:first-child,
        .departments > li:first-child {
            width: 18.59894921190893%;
            height: 64px;
            margin: 0 auto 92px auto;
            padding-top: 25px;
            border-bottom: 4px solid white;
            z-index: 1;
        }

        .subdirector > li:first-child {
            float: right;
            right: 27.2%;
            border-left: 4px solid white;
        }

        .departments > li:first-child {
            float: left;
            left: 27.2%;
            border-right: 4px solid white;
        }

        .subdirector > li:first-child a,
        .departments > li:first-child a {
            width: 100%;
        }

        .subdirector > li:first-child a {
            left: 25px;
        }

        @media all and (max-width: 767px) {
            .subdirector > li:first-child,
            .departments > li:first-child {
                width: 40%;
            }

            .subdirector > li:first-child {
                right: 10%;
                margin-right: 2px;
            }

            .subdirector:after {
                left: 49.8%;
            }

            .departments > li:first-child {
                left: 10%;
                margin-left: 2px;
            }
        }

        .departments > li:first-child a {
            right: 25px;
        }

        .department:first-child,
        .departments li:nth-child(2) {
            margin-left: 0;
            clear: left;
        }

        .departments:after {
            content: "";
            display: block;
            position: absolute;
            width: 81.1%;
            height: 22px;
            border-top: 4px solid #fff;
            border-right: 4px solid #fff;
            border-left: 4px solid #fff;
            margin: 0 auto;
            top: 130px;
            left: 9.1%;
        }

        @media all and (max-width: 767px) {
            .departments:after {
                border-right: none;
                left: 0;
                width: 49.8%;
            }
        }

        @media all and (min-width: 768px) {
            .department:first-child:before,
            .department:last-child:before {
                border: none;
            }
        }

        .department:before {
            content: "";
            display: block;
            position: absolute;
            width: 0;
            height: 22px;
            border-left: 4px solid white;
            z-index: 1;
            top: -22px;
            left: 50%;
            margin-left: -4px;
        }

        .department {
            border-left: 4px solid #fff;
            width: 18.59894921190893%;
            float: left;
            margin-left: 1.751313485113835%;
            margin-bottom: 60px;
        }

        .lt-ie8 .department {
            width: 18.25%;
        }

        @media all and (max-width: 767px) {
            .department {
                float: none;
                width: 100%;
                margin-left: 0;
            }

            .department:before {
                content: "";
                display: block;
                position: absolute;
                width: 0;
                height: 60px;
                border-left: 4px solid white;
                z-index: 1;
                top: -60px;
                left: 0%;
                margin-left: -4px;
            }

            .department:nth-child(2):before {
                display: none;
            }
        }

        .department > a {
            margin: 0 0 -26px -4px;
            z-index: 1;
        }

        .department > a:hover {
            height: 85px;
            width: 100%;
            z-index: 99999;
        }

        .department > ul {
            margin-top: 0px;
            margin-bottom: 0px;
        }

        .department li {
            padding-left: 25px;
            border-bottom: 4px solid #fff;
            height: 90px;
        }

        .department li a {
            background: #fff;
            top: 48px;
            position: absolute;
            z-index: 1;
            width: 90%;
            height: 75px;
            vertical-align: middle;
            right: -1px;
            background-image: url(data:image/svg+xml;base64,PD94bWwgdmVyc2lvbj0iMS4wIiA/Pgo8c3ZnIHhtbG5zPSJodHRwOi8vd3d3LnczLm9yZy8yMDAwL3N2ZyIgd2lkdGg9IjEwMCUiIGhlaWdodD0iMTAwJSIgdmlld0JveD0iMCAwIDEgMSIgcHJlc2VydmVBc3BlY3RSYXRpbz0ibm9uZSI+CiAgPGxpbmVhckdyYWRpZW50IGlkPSJncmFkLXVjZ2ctZ2VuZXJhdGVkIiBncmFkaWVudFVuaXRzPSJ1c2VyU3BhY2VPblVzZSIgeDE9IjAlIiB5MT0iMCUiIHgyPSIxMDAlIiB5Mj0iMTAwJSI+CiAgICA8c3RvcCBvZmZzZXQ9IjAlIiBzdG9wLWNvbG9yPSIjMDAwMDAwIiBzdG9wLW9wYWNpdHk9IjAuMjUiLz4KICAgIDxzdG9wIG9mZnNldD0iMTAwJSIgc3RvcC1jb2xvcj0iIzAwMDAwMCIgc3RvcC1vcGFjaXR5PSIwIi8+CiAgPC9saW5lYXJHcmFkaWVudD4KICA8cmVjdCB4PSIwIiB5PSIwIiB3aWR0aD0iMSIgaGVpZ2h0PSIxIiBmaWxsPSJ1cmwoI2dyYWQtdWNnZy1nZW5lcmF0ZWQpIiAvPgo8L3N2Zz4=);
            background-image: -moz-linear-gradient(-45deg,  rgba(0,0,0,0.25) 0%, rgba(0,0,0,0) 100%) !important;
            background-image: -webkit-gradient(linear, left top, right bottom, color-stop(0%,rgba(0,0,0,0.25)), color-stop(100%,rgba(0,0,0,0)))!important;
            background-image: -webkit-linear-gradient(-45deg,  rgba(0,0,0,0.25) 0%,rgba(0,0,0,0) 100%)!important;
            background-image: -o-linear-gradient(-45deg,  rgba(0,0,0,0.25) 0%,rgba(0,0,0,0) 100%)!important;
            background-image: -ms-linear-gradient(-45deg,  rgba(0,0,0,0.25) 0%,rgba(0,0,0,0) 100%)!important;
            background-image: linear-gradient(135deg,  rgba(0,0,0,0.25) 0%,rgba(0,0,0,0) 100%)!important;
            filter: progid:DXImageTransform.Microsoft.gradient( startColorstr='#40000000', endColorstr='#00000000',GradientType=1 );
        }

        .department li a:hover {
            box-shadow: 8px 8px 9px -4px rgba(0,0,0,0.1);
            padding-top: 2px;
            height: 88px;
            width: 95%;
            top: 39px;
            background-image: none!important;
        }

        /* Department/ section colors */
        .department.dep-a a { background: #AAD4E7; }
        .department.dep-b a { background: #d9c0d5; }
        .department.dep-c a { background: #ffcbcb; }
        .department.dep-d a { background: #d8ce79; }
        .department.dep-e a { background: #edcca3; }

        ul a span.title { font-weight: 700; font-size: 13px; color: #066673; }

        ul a span.central {
            top: 50%;
            color: #066673;
            font-size: 14px;
            margin-top: -0.7em;
            display: block;
        }
    </style>
</head>
<body>

    <ul class="administration">
      <li>

              <li class="department dep-e">
                <a href="#"><span class="title">SUCAR</span><span>Superintendência de Captação de Recursos</span></a>
                <ul class="sections">

                  <li class="section"><a href="#"><span class="title">COPEC</span><span>Coord. de Operações de Crédito </span></a></li>
                  <li class="section"><a href="#"><span class="title">COAP</span><span>Coord. de Análise de Parceria Pública - Privada</span></a></li>

              </li>
            </ul>
          </li>
        </ul>
      </li>
    </ul>
  </figure>
